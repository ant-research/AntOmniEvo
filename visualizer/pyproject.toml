[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-omnievo-visualizer"
version = "0.1.1"
description = "Flask backend for the AntOmniEvo visualization frontend"
requires-python = ">=3.10"
# Table form — see the note in the root pyproject.toml (CI image caps at
# setuptools 68; PEP 639 string form needs setuptools>=77).
license = {text = "Apache-2.0"}
dependencies = [
    "ant-omnievo",
    "flask>=3.0",
    "flask-cors>=4.0",
]

[project.scripts]
antomnievo-visualizer = "antomnievo_visualizer.server:main"
antomnievo-visualizer-manage = "antomnievo_visualizer.manage:main"

# Resolve the unpublished ant-omnievo dependency to the local repo root in editable installs.
[tool.uv.sources]
ant-omnievo = { path = "..", editable = true }

[tool.setuptools.packages.find]
include = ["antomnievo_visualizer*"]
